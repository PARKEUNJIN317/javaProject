<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<form name="SignIn" method="post" action="insertMember2">
		<h2>회원가입</h2>
			<table>
				<tr><td>성명</td><td><input type="text" name="userName"><tr><td>
				<tr><td>ID</td><td><input type="text" name="userId"><tr><td>
				<tr><td>비밀번호</td><td><input type="password" name="userPw"><tr><td>
				<tr><td>휴대폰번호</td><td><input type="text" name="userPhone"><tr><td>
				<tr><td>학년</td><td>
				<input type="radio" id="year1" name="year"><label for="year1">1학년</label>
				<input type="radio" id="year2" name="year"><label for="year2">2학년</label>
				<input type="radio" id="year3" name="year"><label for="year3">3학년</label>
				<input type="radio" id="year4" name="year"><label for="year4">4학년</label>
				<tr><td>
				<tr><td>관심분야</td><td><input type="checkbox" name="interest">
				<input type="checkbox" id="web" name="interest"><label for="web">웹 프로그래밍</label>
				<input type="checkbox" id="python" name="interest"><label for="python">파이썬</label>
				<input type="checkbox" id="bigdata" name="interest"><label for="bigdata">빅데이터</label>
				<input type="checkbox" id="java" name="interest"><label for="java">자바 프로그래밍</label>
				<tr><td>
				<tr><td>학과</td><td>
				<select id="major">
				<option value="major1">컴퓨터공학</option>
				<option value="major1">경제학과</option>
				<option value="major1">경영학과</option>
				<option value="major1">국문과</option>
				</select><tr><td>
			</table>
			<input type="submit" value="완료"><input type="reset" value="취소">
		</form>

</body>
</html>
